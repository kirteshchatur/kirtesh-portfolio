    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Kirtesh Ravindra Chatur",
        "alternateName": "Kirtesh Chatur",
        "jobTitle": "Computer Engineering Student • Developer • Problem Solver",
        "description": "Computer Engineering student and developer focused on full-stack web applications, AI-powered solutions, and modern user experiences.",
        "url": "https://github.com/kirteshchatur",
        "sameAs": [
          "https://github.com/kirteshchatur"
        ],
        "alumniOf": {
          "@type": "EducationalOrganization",
          "name": "Padmabhushan Vasantdada Patil Institute of Technology (PVPIT), Pune"
        },
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Pune",
          "addressRegion": "Maharashtra",
          "addressCountry": "India"
        }
      }
    </script>

    <!-- Inline script to prevent theme flash -->
    <script>
      (function () {
        try {
          const stored = localStorage.getItem('theme');
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (stored === 'dark' || (!stored && prefersDark) || !stored) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>

  <body class="bg-background-light dark:bg-background-dark text-zinc-900 dark:text-zinc-100 font-sans antialiased selection:bg-blue-500/20 selection:text-blue-400">
